<style>
  :root {
    --bg: #1c1c1e;

  .line {
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 1.45em;

  /* colours */

  .red     { color: var(--red); }
  .yellow  { color: var(--yellow); }
  .blue    { color: var(--blue); }
  .cyan    { color: var(--cyan); }
  .magenta { color: var(--magenta); }
  .orange  { color: var(--orange); }

  .claude  { color: var(--claude); }
  .claude.spinning {
    display: inline-block;

    text-align: center;

    0%   { transform: rotate(0deg); }

<body>
<div class="window">
  <div class="terminal" id="term"></div>
  <input id="hiddenInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="position:fixed;opacity:0;pointer-events:none;top:-100px;left:-100px;width:1px;height:1px;">
  <div class="inputbar">
    <div class="tokens" id="tokens">0 tokens</div>
    <div class="promptbox" id="promptbox">
      <span class="prompt-char">❯</span><span id="inputText"></span><span class="cursor"></span>
    </div>
    <div class="statusline" id="statusline"><span class="mode">⏵⏵ auto mode on</span> (shift+tab to cycle) · ← for agents<span id="speedInfo"></span></div>
  </div>
</div>

<script>
// ── SETUP ─────────────────────────────────────────────────
const term        = document.getElementById('term');
const promptbox   = document.getElementById('promptbox');
const hiddenInput = document.getElementById('hiddenInput');
const inputTextEl = document.getElementById('inputText');
const statuslineEl= document.getElementById('statusline');
const MAX_LINES = 250;
const tokensEl = document.getElementById('tokens');
let tokenCount = rint2(800, 4000);

// ── INPUT MODE STATE ──────────────────────────────────────
let inputMode      = false;   // user is typing
let interrupted    = false;   // fast-forward current task silently
let waitingForUser = false;   // main loop is paused
let resumeSimFn    = null;    // call to unblock main loop
let userTyped      = '';      // what the user has typed so far
function rint2(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
function bumpTokens(n) {
  tokenCount += n;
  tokensEl.textContent = tokenCount >= 1000
    ? (tokenCount / 1000).toFixed(1) + 'k tokens'
    : tokenCount + ' tokens';
}

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rand = a => a[Math.floor(Math.random() * a.length)];
const rint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const jitter = (ms, pct = 0.4) => ms * (1 - pct + Math.random() * pct * 2);

// ── PLAYBACK CONTROLS (↑/↓ speed, Enter pause) ────────────
let speedMult = 1;
let paused = false;
const SPEED_STEPS = [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 6, 8];

const rawSleep = ms => new Promise(r => setTimeout(r, ms));

// suspend the whole simulation while the tab is hidden — no timers
// churning, no DOM writes, no allocation while nobody is watching
let hiddenTab = document.hidden;
document.addEventListener('visibilitychange', () => { hiddenTab = document.hidden; });

// all animation timing funnels through here, so speed changes,
// pause, and tab visibility apply instantly, even mid-spinner
async function sleep(baseMs) {
  if (interrupted) return;
  let remaining = baseMs;
  while (remaining > 0) {
    if (interrupted) return;
    if (paused || hiddenTab) { await rawSleep(250); continue; }
    const chunk = Math.min(60, remaining / speedMult);
    await rawSleep(chunk);
    remaining -= chunk * speedMult;
  }
}

let statusHideTimer = null;
function updateStatusline() {
  const speedEl = document.getElementById('speedInfo');
  clearTimeout(statusHideTimer);
  if (inputMode) {
    statuslineEl.innerHTML = '<span class="input-mode">⌨ input mode</span> — esc to cancel · enter to submit';
    return;
  }
  statuslineEl.innerHTML = '<span class="mode">⏵⏵ auto mode on</span> (shift+tab to cycle) · ← for agents<span id="speedInfo"></span>';
  const newSpeedEl = document.getElementById('speedInfo');
  if (paused) {
    newSpeedEl.innerHTML = ' · <span class="red bold">⏸ paused — enter to resume</span>';
    return;
  }
  newSpeedEl.innerHTML = ` · <span class="cyan">${speedMult}× speed (↑/↓)</span> · <span class="cyan">${fontSize}px (+/−)</span>`;
  statusHideTimer = setTimeout(() => {
    const el = document.getElementById('speedInfo');
    if (el) el.innerHTML = '';
  }, 2500);
}

// font size (+ / - keys)
const FONT_MIN = 8, FONT_MAX = 28;
let fontSize = 12.5;
function applyFontSize() {
  document.querySelector('.terminal').style.fontSize = fontSize + 'px';
  document.querySelector('.inputbar').style.fontSize = fontSize + 'px';
  scroll();
}

document.addEventListener('keydown', e => {
  if (inputMode) {
    if (e.key === 'Escape') {
      e.preventDefault();
      userTyped = ''; hiddenInput.value = ''; inputTextEl.textContent = '';
      deactivateInputMode();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      handleSubmit();
    }
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const i = SPEED_STEPS.indexOf(speedMult);
    const next = e.key === 'ArrowUp' ? Math.min(i + 1, SPEED_STEPS.length - 1) : Math.max(i - 1, 0);
    speedMult = SPEED_STEPS[next];
    updateStatusline();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    paused = !paused;
    updateStatusline();
  } else if (e.key === '+' || e.key === '=') {
    e.preventDefault();
    fontSize = Math.min(FONT_MAX, fontSize + 1);
    applyFontSize(); updateStatusline();
  } else if (e.key === '-' || e.key === '_') {
    e.preventDefault();
    fontSize = Math.max(FONT_MIN, fontSize - 1);
    applyFontSize(); updateStatusline();
  }
});

// ── INPUT MODE HANDLERS ───────────────────────────────────
function activateInputMode() {
  if (inputMode) return;
  inputMode    = true;
  interrupted  = true;
  waitingForUser = true;
  userTyped    = '';
  hiddenInput.value = '';
  inputTextEl.textContent = '';
  promptbox.classList.add('input-active');
  hiddenInput.focus();
  updateStatusline();
}

function deactivateInputMode() {
  inputMode      = false;
  interrupted    = false;
  waitingForUser = false;
  promptbox.classList.remove('input-active');
  hiddenInput.blur();
  updateStatusline();
  if (resumeSimFn) { resumeSimFn(); resumeSimFn = null; }
}

hiddenInput.addEventListener('input', () => {
  userTyped = hiddenInput.value;
  inputTextEl.textContent = userTyped;
});

hiddenInput.addEventListener('blur', () => {
  // only deactivate if still in input mode (not mid-submit)
  if (inputMode) deactivateInputMode();
});

// click the promptbox to enter input mode
promptbox.addEventListener('click', () => {
  if (!inputMode) activateInputMode();
});

function waitForResume() {
  return new Promise(r => { resumeSimFn = r; });
}

async function handleSubmit() {
  const text = userTyped.trim();
  // switch off input mode visuals but keep waitingForUser=true until mock is done
  inputMode = false;
  interrupted = false;
  userTyped = '';
  hiddenInput.value = '';
  inputTextEl.textContent = '';
  promptbox.classList.remove('input-active');
  hiddenInput.blur();
  updateStatusline();

  await mockUserCommand(text);

  waitingForUser = false;
  if (resumeSimFn) { resumeSimFn(); resumeSimFn = null; }
}

const USER_ACKS = [
  "On it. Let me take a look.",
  "Sure, I'll handle that.",
  "Got it — working on it now.",
  "Let me dig into that.",
  "I'll take care of it.",
  "Understood. Starting now.",
  "Right, let me trace through this.",
];

async function mockUserCommand(text) {
  await line('', 0);
  if (text) {
    await line(`<span class="green bold">❯</span> <span class="text">${esc(text)}</span>`, 0);
  }
  await line('', 30);
  await spinner(rand(THINK_WORDS), rint(1500, 3000));
  await line(`${T}${esc(rand(USER_ACKS))}`, 40);
  await line('', 30);

  const deadline = Date.now() + rint(10000, 15000);
  const pool = [...EXPLORE, ...IMPLEMENT, ...VERIFY];
  while (Date.now() < deadline) {
    await rand(pool)();
    if (Math.random() < 0.35) await claudeSay(rand(CLAUDE_REMARKS));
    await sleep(jitter(120));
  }
  await line('', 30);
}

function trim() {
  while (term.children.length > MAX_LINES) term.removeChild(term.firstChild);
}

// batch scrolls into one per frame instead of forcing a reflow per line
let scrollQueued = false;
function scroll() {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => {
    scrollQueued = false;
    term.scrollTop = term.scrollHeight;
  });
}

function addLine(html = '') {
  if (interrupted) return document.createElement('div');
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = html;
  term.appendChild(div);
  bumpTokens(rint2(4, 60));
  trim(); scroll();
  return div;
}

// print a line, optionally after a delay
async function line(html = '', delay = 15) {
  if (delay) await sleep(jitter(delay));
  return addLine(html);
}

// ── SPINNERS & PROGRESS ───────────────────────────────────
const SPIN = ['✢','✳','✶','✻','✽','✻','✶','✳'];
const THINK_WORDS = ['Thinking','Pondering','Reasoning','Musing','Considering',
  'Deliberating','Contemplating','Percolating','Ruminating','Synthesizing',
  'Simmering','Cogitating','Brewing','Vibing','Noodling'];

async function spinner(label, ms) {
  // build the nodes once and mutate textContent per tick — no HTML
  // re-parsing or node churn while the spinner runs
  const div = addLine();
  const glyph = document.createElement('span');
  glyph.className = 'claude spinning';
  const txt = document.createElement('span');
  txt.className = 'dim';
  div.append(glyph, ' ', txt);
  glyph.textContent = '✳';
  let elapsed = 0, lastSecs = -1;
  while (elapsed < ms && !interrupted) {
    const secs = Math.floor(elapsed / 1000);
    if (secs !== lastSecs) {
      txt.textContent = `${label}… (${secs}s · esc to interrupt)`;
      lastSecs = secs;
    }
    scroll();
    await sleep(65);
    elapsed += 65;
  }
  div.remove();
}

async function progressBar(label, ms, cls = 'green') {
  const div = addLine();
  const width = 26;
  const labelSpan = document.createElement('span');
  labelSpan.className = 'dim';
  labelSpan.textContent = `  ${label} `;
  const barSpan = document.createElement('span');
  barSpan.className = cls;
  const pctSpan = document.createElement('span');
  pctSpan.className = 'dim';
  div.append(labelSpan, barSpan, ' ', pctSpan);
  let elapsed = 0, lastFilled = -1;
  while (!interrupted) {
    const pct = Math.min(1, elapsed / ms);
    const filled = Math.round(pct * width);
    if (filled !== lastFilled) {
      barSpan.textContent = `[${'█'.repeat(filled)}${'░'.repeat(width - filled)}]`;
      lastFilled = filled;
    }
    pctSpan.textContent = `${Math.round(pct * 100)}%`;
    scroll();
    if (pct >= 1) break;
    await sleep(40);
    elapsed += 40;
  }
  await sleep(80);
}

// ── FAKE DATA POOLS ───────────────────────────────────────
const DIRS = ['.', 'src', 'src/components', 'src/utils', 'assets', 'js', 'css', 'pages'];

const JS_FILES = ['app.js','index.html','style.css','chart.js','theme.js','carousel.js',
  'dashboard.html','pricing.html','components.css','layout.css','animations.css',
  'formatters.js','api.js','search.js','modal.js','tabs.js','gallery.html',
  'form-validation.js','dropdown.js','tooltip.css','navbar.css','settings.html'];

const PY_FILES = ['fetch_data.py','pipeline.py','models.py','tasks.py','report.py',

const TEST_FILES = ['auth.test.ts','apiClient.test.ts','validators.test.ts',
  'useFetch.test.tsx','Dashboard.test.tsx','rateLimiter.test.ts','queue.test.ts',

const FUNCS = ['parseToken','refreshSession','buildQuery','normalizeUser','debounce',
  'retryWithBackoff','formatCurrency','validateEmail','mergeConfig','hashPassword',

const PKGS = ['zod','date-fns','pino','fastify','express','pg','prisma','vitest',
  'react-query','axios','ioredis','dotenv','jsonwebtoken','bcryptjs','uuid'];

const BRANCHES = ['feat/user-settings','fix/session-expiry','refactor/api-client',
  'feat/csv-export','fix/rate-limit-headers','chore/upgrade-deps','feat/dark-mode',

  "I'll start by looking at how this is currently implemented.",

// ── OUTPUT HELPERS (Claude Code style) ────────────────────
const T = '<span class="claude">⏺</span> ';           // tool / assistant bullet
const R = '  <span class="dim">⎿</span>  ';            // result connector

async function toolCall(name, arg) {
  await line(`${T}<span class="bold">${esc(name)}</span><span class="dim">(${esc(arg)})</span>`, 90);
}
async function toolResult(text, cls = 'dim') {
  await line(`${R}<span class="${cls}">${esc(text)}</span>`, 70);
}
// occasional long stall — real sessions sit on the spinner for seconds
// while the model thinks or a slow tool call runs
async function maybeLongPause(chance = 0.18) {
  if (Math.random() < chance) await spinner(rand(THINK_WORDS), rint(5000, 10000));
}

async function claudeSay(text) {
  // most remarks follow a short think, but sometimes it's a long one
  await spinner(rand(THINK_WORDS), Math.random() < 0.15 ? rint(5000, 9000) : rint(400, 1200));
  await line(`${T}${esc(text)}`, 40);
  await line('', 20);
}

  { file: 'js/ws-manager.js', lines: [
    "const WS_URL        = `wss://${location.host}/ws`;",
    "const RECONNECT_BASE = 1000;",
    "const RECONNECT_CAP  = 30000;",
    "",
    "const STATE = {",
    "  ws:       null,",
    "  attempt:  0,",
    "  timer:    null,",
    "  handlers: new Map(),",
    "};",
    "",
    "export function connect() {",
    "  if (STATE.ws?.readyState === WebSocket.OPEN) return;",
    "  STATE.ws = new WebSocket(WS_URL);",
    "  STATE.ws.addEventListener('open',    onOpen);",
    "  STATE.ws.addEventListener('message', onMessage);",
    "  STATE.ws.addEventListener('close',   onClose);",
    "  STATE.ws.addEventListener('error',   onError);",
    "}",
    "",
    "function onOpen() {",
    "  STATE.attempt = 0;",
    "  clearTimeout(STATE.timer);",
    "  emit('_connected');",
    "}",
    "",
    "function onMessage(e) {",
    "  let msg;",
    "  try { msg = JSON.parse(e.data); } catch { return; }",
    "  emit(msg.type, msg.payload);",
    "}",
    "",
    "function onClose(e) { if (!e.wasClean) scheduleReconnect(); }",
    "function onError()  { STATE.ws?.close(); }",
    "",
    "function scheduleReconnect() {",
    "  const delay = Math.min(",
    "    RECONNECT_BASE * 2 ** STATE.attempt++ + Math.random() * 500,",
    "    RECONNECT_CAP,",
    "  );",
    "  STATE.timer = setTimeout(connect, delay);",
    "}",
    "",
    "function emit(type, payload) {",
    "  (STATE.handlers.get(type) ?? []).forEach(fn => fn(payload));",
    "}",
    "",
    "export function on(type, fn) {",
    "  if (!STATE.handlers.has(type)) STATE.handlers.set(type, []);",
    "  STATE.handlers.get(type).push(fn);",
    "  return () => {",
    "    const list = STATE.handlers.get(type);",
    "    STATE.handlers.set(type, list.filter(f => f !== fn));",
    "  };",
    "}",
    "",
    "export function send(type, payload) {",
    "  if (STATE.ws?.readyState !== WebSocket.OPEN)",
    "    throw new Error('WebSocket not connected');",
    "  STATE.ws.send(JSON.stringify({ type, payload }));",
    "}",

async function showDiffLines(lines, mode, startLn) {
  const cls = mode === 'add' ? 'add' : mode === 'del' ? 'del' : 'dim';
  const pfx = mode === 'add' ? '+' : mode === 'del' ? '-' : ' ';
  let ln = startLn;
  for (const l of lines) {
    if (interrupted) break;
    await line(`<span class="${cls}">${LN(ln++)}${pfx}  ${esc(l)}</span>`, 5);
  }
  return ln;
}

async function scnLargeWrite() {
  const chunk = rand(LARGE_WRITES);
  await claudeSay(rand(CLAUDE_REMARKS));
  await toolCall('Write', chunk.file);
  await toolResult(`Wrote ${chunk.lines.length} lines to ${chunk.file}`, 'green');
  await showDiffLines(chunk.lines, 'add', 1);
  await line('', 20);
}

async function scnLargeReplace() {
  const chunk = rand(LARGE_REPLACES);
  if (Math.random() < 0.55) {
    await toolCall('Read', chunk.file);
    await toolResult(`Read ${rint(chunk.del.length + 30, chunk.del.length + 120)} lines`);
    await maybeLongPause(0.2);
  }
  await toolCall('Update', chunk.file);
  const adds = chunk.add.length, dels = chunk.del.length;
  await toolResult(
    `Updated ${chunk.file} · +${adds} −${dels}`,
    adds > 0 ? 'green' : 'yellow'
  );
  let ln = rint(8, 80);
  if (chunk.before?.length) ln = await showDiffLines(chunk.before, 'ctx', ln);
  const delStart = ln;
  ln = await showDiffLines(chunk.del, 'del', ln);
  if (chunk.add.length) ln = await showDiffLines(chunk.add, 'add', delStart);
  if (chunk.after?.length) await showDiffLines(chunk.after, 'ctx', ln);
  await line('', 20);
}

const LN = n => `<span style="opacity:0.45;user-select:none"> ${String(n).padStart(3)} </span>`;

async function diffBlock(chunk) {
  await toolCall('Update', chunk.file);
  const addCount = chunk.add.split('\n').length;
  await toolResult(`Updated ${chunk.file} with ${addCount} addition${addCount>1?'s':''} and 1 removal`);
  let ln = rint(8, 180);
  const ctx = async (text) => {
    await line(`<span class="dim">${LN(ln++)}   ${esc(text)}</span>`, 22);
  };
  for (const t of chunk.before) await ctx(t);
  await line(`<span class="del">${LN(ln)}-  ${esc(chunk.del)}</span>`, 45);
  for (const a of chunk.add.split('\n')) {
    await line(`<span class="add">${LN(ln++)}+  ${esc(a)}</span>`, 45);
  }
  for (const t of chunk.after) await ctx(t);
  await line('', 20);
}

async function scnMultiAgent() {
  const mission  = rand(MULTI_MISSIONS);
  const count    = rint(4, 6);

  // pick N distinct agents
  const pool   = [...AGENT_TEMPLATES].sort(() => Math.random() - 0.5);
  const agents = pool.slice(0, count).map((t, i) => ({
    id:       i + 1,
    task:     t.task,
    mcp:      t.mcp,
    result:   t.result,
    duration: rint(10, 38),
    uses:     rint(6, 18),
  }));

  // announce
  await claudeSay(`I'll run ${count} agents in parallel to ${mission.goal}.`);

  // spawn list
  for (let i = 0; i < agents.length; i++) {
    const a   = agents[i];
    const con = i === 0 ? '┌' : i === agents.length - 1 ? '└' : '├';
    await line(
      `  <span class="dim">${con}</span> <span class="claude bold">Agent ${a.id}</span>` +
      ` <span class="dim">· Explore ·</span> <span class="cyan">${esc(a.mcp)}</span>` +
      ` <span class="dim">— ${esc(a.task)}</span>`,
      55
    );
  }
  await line('', 30);

  // running spinner — decrements active count as time passes
  const spinMs   = rint(6000, 12000);
  const div      = addLine();
  const glyph    = document.createElement('span'); glyph.className = 'claude';
  const txt      = document.createElement('span'); txt.className   = 'dim';
  div.append(glyph, ' ', txt);
  let elapsed = 0, si = 0, lastSecs = -1;
  while (elapsed < spinMs && !interrupted) {
    glyph.textContent = SPIN[si++ % SPIN.length];
    const secs    = Math.floor(elapsed / 1000);
    const active  = Math.max(1, count - Math.floor(elapsed / (spinMs / count)));
    if (secs !== lastSecs) {
      txt.textContent = `${active} of ${count} agents running… (${secs}s)`;
      lastSecs = secs;
    }
    scroll();
    await sleep(65);
    elapsed += 65;
  }
  div.remove();
  await line('', 20);

  // agents complete in order of duration
  const sorted = [...agents].sort((a, b) => a.duration - b.duration);
  for (const a of sorted) {
    if (interrupted) break;
    await line(
      `  <span class="green">✓</span> <span class="bold">Agent ${a.id}</span>` +
      ` <span class="dim">finished in ${a.duration}s ·</span>` +
      ` <span class="cyan">${esc(a.mcp)}</span>` +
      ` <span class="dim">· ${a.uses} tool calls</span>`,
      rint(250, 700)
    );
    await line(
      `    <span class="dim">⎿</span>  <span class="dim">${esc(a.result)}</span>`,
      30
    );
    await line('', 15);
  }

  // synthesis

async function codeBlock(lines, maxShow = 6) {
  const show = lines.slice(0, maxShow);
  let n = 1;
  for (const l of show) {
    await line(`       <span class="dim">${String(n++).padStart(3)}</span>  <span class="cyan">${esc(l)}</span>`, 30);
  }
  if (lines.length > maxShow)
    await line(`       <span class="dim">     … +${lines.length - maxShow + rint(4, 30)} more lines</span>`, 25);
}

async function scnAgent() {

    ['Trace the tab-switch flicker', 'Explored 9 files. The chart is destroyed and re-created on every tab click because the config object is rebuilt inline — chart.js:142 needs memoization.'],

    ['Audit the CSS for hardcoded colors', 'Found 17 hex colors outside :root across 4 stylesheets — they bypass the token set, which is why dark mode misses them.'],
    ['Map every scroll listener', 'Found 6 scroll listeners; 4 run layout reads (offsetTop) in the handler causing forced reflow — should batch via requestAnimationFrame.'],
    ['Trace the layout shift on load', 'Lighthouse reports CLS 0.31. Cause: gallery images have no width/height attributes and the web font swaps late — both fixable.'],
  ];
  const [name, result] = rand(jobs);
  await toolCall('Task', `${name} · subagent: Explore`);
  await spinner(`Running ${name}`, rint(1200, 2600));
  await toolResult(result);
  await toolResult(`Done (${rint(9, 34)} tool uses · ${rint(18, 92)}.${rint(0,9)}k tokens · ${rint(24, 110)}s)`, 'green');

}

async function scnCoverage() {
  await toolCall('Bash', 'npx vitest run --coverage');
  await spinner('Collecting coverage', rint(900, 1800));
  const rows = [['statements', rint(84, 98)], ['branches', rint(74, 95)], ['functions', rint(80, 97)], ['lines', rint(85, 98)]];
  for (const [k, v] of rows) {
    const cls = v >= 90 ? 'green' : v >= 80 ? 'yellow' : 'red';
    await line(`${R}<span class="dim">${k.padEnd(12)}</span><span class="${cls}">${v}%</span> <span class="dim">(${rint(200,1400)}/${rint(1500,1600)})</span>`, 35);
  }
}

async function scnLogs() {
  await toolCall('Bash', 'tail -f logs/app.log — watching for the error');
  const lvls = [['INFO','dim'],['INFO','dim'],['WARN','yellow'],['DEBUG','dim'],['ERROR','red']];
  const msgs = ['request completed route=/api/orders status=200 dur=14ms',
    'cache miss key=fx:USD-THB — fetching upstream',
    'retrying webhook delivery attempt=2 backoff=500ms',
    'pool checkout latency 230ms exceeds soft limit',
    'unhandled rejection in queue consumer: TimeoutError after 10000ms'];
  const n = rint(3, 5);
  for (let i = 0; i < n; i++) {
    const [lvl, cls] = lvls[Math.min(i, lvls.length-1)];
    const ts = new Date(Date.now() - rint(0, 60000)).toISOString().slice(11, 23);
    await line(`${R}<span class="dim">${ts}</span> <span class="${cls}">${lvl.padEnd(5)}</span> <span class="dim">${esc(msgs[Math.min(i, msgs.length-1)])}</span>`, rint(120, 400));
  }
}

async function renderTodos(items, doneCount) {
  await toolCall('TodoWrite', `${items.length} todos`);
  for (let i = 0; i < items.length; i++) {
    const done = i < doneCount;
    const active = i === doneCount;
    const box = done ? '<span class="green">☒</span>' : '☐';
    const txt = done ? `<span class="dim" style="text-decoration:line-through">${esc(items[i])}</span>`
              : active ? `<span class="bold">${esc(items[i])}</span>`
              : `<span class="dim">${esc(items[i])}</span>`;
    await line(`${R}${box} ${txt}`, 25);
  }
  await line('', 20);
}

async function phase(pool, count, remarkChance) {
  for (let i = 0; i < count; i++) {
    await rand(pool)();
    if (Math.random() < remarkChance) await claudeSay(rand(CLAUDE_REMARKS));
    await maybeLongPause();
    await sleep(jitter(100));
  }
}

async function runTask() {
  await taskHeader(rand(PROMPTS));

  // plan: write a todo list up front
  const todos = rand(TODO_SETS).slice();
  await claudeSay(rand(CLAUDE_REMARKS));
  await renderTodos(todos, 0);

  // phase 1 — explore (reads, greps, subagents, web research, logs)
  await phase(EXPLORE, rint(2, 4), 0.4);
  await renderTodos(todos, rint(1, 2));

  // phase 2 — implement (multi-file edits, new code, migrations)
  await phase(IMPLEMENT, rint(2, 4), 0.35);
  await renderTodos(todos, todos.length - 2);

  // phase 3 — verify (tests, typecheck, benchmarks, coverage)
  await phase(VERIFY, rint(2, 3), 0.25);

  // sometimes publish a before/after artifact for visual review
  if (Math.random() < 0.2) await scnArtifact();

  // occasionally a verification failure forces another implement/verify round
  if (Math.random() < 0.3) {
    await claudeSay('Verification surfaced an edge case — going back to handle it.');
    await phase(IMPLEMENT, 1, 0);
    await phase(VERIFY, 1, 0);
  }
  await renderTodos(todos, todos.length - 1);

  // phase 4 — land it
  await scnGitCommit();
  await renderTodos(todos, todos.length);

  // summary
  await sleep(jitter(150));
  const summary = rand(SUMMARIES);
  await line(`${T}<span class="bold">Done.</span> ${esc(summary[0])}`, 60);
  await line(`  ${esc(summary[1])}`, 40);
  await line('', 30);
  // idle at the prompt for a while, as if the user is reading the summary
  // and typing the next request
  await sleep(rint(5000, 10000));
}
